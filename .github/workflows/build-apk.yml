name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | head -80

      - name: Download dependencies
        run: |
          gradle --no-daemon --stacktrace --refresh-dependencies             :app:dependencies --configuration debugRuntimeClasspath

      - name: Build debug APK
        run: |
          gradle --no-daemon --stacktrace --refresh-dependencies             :app:assembleDebug

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK produced"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports
            app/build/outputs/logs
          if-no-files-found: ignore
