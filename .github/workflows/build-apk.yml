name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find Android project
        run: |
          unzip -q STX_Horror_Animator.zip -d project
          PROJECT_DIR=$(find project -name settings.gradle.kts -o -name settings.gradle | head -n 1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android Gradle project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed | head -100 || true

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Find APK
        id: apk
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          echo "APK found: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STX-Horror-Animator-APK
          path: ${{ env.PROJECT_DIR }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error
